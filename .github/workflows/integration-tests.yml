# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Integration tests"

on:
  pull_request:
  push:
    branches:
      - "1.4.x"

env:
  COMPOSER_ROOT_VERSION: "1.4.x-dev"

permissions:
  contents: read

jobs:
  integration-test:
    name: "Integration test"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        composer-version:
          - "v2"
          - "preview"
          - "snapshot"
          - "2.1.0"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          tools: "composer:${{ matrix.composer-version }}"

      - name: "Install dependencies"
        working-directory: "e2e/integration"
        run: "composer install --no-interaction --no-progress --no-suggest"

      - name: "Test"
        working-directory: "e2e/integration"
        run: "vendor/bin/phpstan analyse -l 8 FooTest.php"

      - name: "Rename directory"
        working-directory: "e2e"
        run: "mv integration integration-copy"

      - name: "Test relative paths - after renaming"
        working-directory: "e2e/integration-copy"
        run: "vendor/bin/phpstan analyse -l 8 FooTest.php"

  ignore-test:
    name: "Ignore test"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        composer-version:
          - "v2"
          - "preview"
          - "snapshot"
          - "2.1.0"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          tools: "composer:${{ matrix.composer-version }}"

      - name: "Install dependencies"
        working-directory: "e2e/ignore"
        run: "composer install --no-interaction --no-progress --no-suggest"

      - name: "Test"
        working-directory: "e2e/ignore"
        run: "vendor/bin/phpstan analyse -l 8 IgnoreTest.php"
